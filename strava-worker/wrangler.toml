name = "strava-miles"
main = "src/index.js"
compatibility_date = "2026-07-11"

[vars]
# Month/year boundaries are computed in this timezone.
TIMEZONE = "America/Chicago"

# Each visitor gets at most 5 requests per minute (period must be 10 or 60).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
