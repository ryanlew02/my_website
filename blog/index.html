<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- Colors iOS Safari's status-bar chrome (the strip behind the clock/battery,
             which pages can't paint into); matches --color-bg -->
        <meta name="theme-color" content="#161826" />
        <meta name="description" content="The journey to coding a conscious simulation, by Ryan Lewandowski. No AI writing. Raw thoughts, not polished." />
        <meta name="author" content="Ryan Lewandowski" />
        <title>Blog · Ryan Lewandowski</title>
        <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
        <link rel="canonical" href="https://ryanlewan.com/blog/" />

        <!-- Open Graph / social share preview -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://ryanlewan.com/blog/" />
        <meta property="og:title" content="Blog · Ryan Lewandowski" />
        <meta property="og:description" content="The journey to coding a conscious simulation. No AI writing. Raw thoughts, not polished." />
        <meta property="og:image" content="https://ryanlewan.com/assets/myPhoto.jpeg" />
        <meta property="og:image:alt" content="Ryan Lewandowski" />

        <!-- Twitter / X card -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Blog · Ryan Lewandowski" />
        <meta name="twitter:description" content="The journey to coding a conscious simulation. No AI writing. Raw thoughts, not polished." />
        <meta name="twitter:image" content="https://ryanlewan.com/assets/myPhoto.jpeg" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <!-- The site's design system — tokens, base, header, footer — then only
             what this page adds on top of it. -->
        <link rel="stylesheet" href="../style.css?v=6082b546" />
        <link rel="stylesheet" href="blog.css?v=41d1306a" />
    </head>

    <body class="blog-page">

        <!-- Fixed site header. The nav points back into the home page's
             sections; there is no blog pill here because this is the blog. -->
        <header class="site-header">
            <div class="header-left">
                <a class="logo" href="../" aria-label="Home">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M12 3a9 9 0 1 0 9 9h-6a3 3 0 1 1-3-3V3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </a>
            </div>

            <div class="header-right">
                <!-- The three section links are marked as the ones a phone drops;
                     see .nav-deep in blog.css. "Home" always stays. -->
                <nav class="nav">
                    <a href="../">Home</a>
                    <a class="nav-deep" href="../#about">About</a>
                    <a class="nav-deep" href="../#projects">Projects</a>
                    <a class="nav-deep" href="../#reading">Reading</a>
                </nav>

                <!-- Where the home page keeps its terminal pill. This is the one
                     action on the page, so it keeps its full label at every width. -->
                <a class="medium-btn" href="https://medium.com/@ryanlewan-sim"
                   target="_blank" rel="noopener noreferrer">
                    Read on Medium
                    <span class="medium-btn-arrow" aria-hidden="true">↗</span>
                </a>
            </div>
        </header>

        <main class="scroll-container">

            <!-- Paints the band iOS Safari reveals behind the status bar while
                 scrolling (see .statusbar-cover in style.css) -->
            <div class="statusbar-cover" aria-hidden="true"></div>

            <!-- ── Masthead ───────────────────────────────── -->
            <section class="snap-section" id="blog-top">
                <div class="section-inner blog-inner">
                    <div class="meta">
                        <span>Writing</span>
                        <span>Notes</span>
                        <span id="blogYear">2026</span>
                    </div>

                    <div class="blog-masthead">
                        <h1 class="blog-title">The Journey To Coding A Conscious Simulation</h1>
                        <p class="blog-lede">
                            No AI writing. Raw thoughts, not polished.
                        </p>
                    </div>

                    <!-- Posts are rendered from the POSTS array in blog.js. While that
                         array is empty this list holds the placeholder below, which
                         blog.js clears as soon as there is a first post. -->
                    <div class="post-list" id="postList">
                        <p class="post-empty">
                            <span class="post-empty-dot" aria-hidden="true"></span>
                            First posts arriving soon.
                        </p>
                    </div>

                    <footer class="site-footer">
                        <div class="footer-copy">© <span id="year"></span> Ryan Lewandowski</div>
                        <div class="links" aria-label="Social links">
                            <a href="https://github.com/ryanlew02" target="_blank" rel="noopener noreferrer">GitHub</a>
                            <span>/</span>
                            <button class="copy-email" data-email="ryanlewan.2@gmail.com">Email</button>
                            <span>/</span>
                            <a href="https://www.linkedin.com/in/ryan-lewandowski-120546164/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                            <span>/</span>
                            <a href="https://leetcode.com/u/ryanlew02/" target="_blank" rel="noopener noreferrer">LeetCode</a>
                        </div>
                    </footer>
                </div>
            </section>

        </main>

        <script src="posts.js?v=73440404"></script>
        <script src="blog.js?v=6e820216"></script>
    </body>
</html>
