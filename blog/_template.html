<!doctype html>
<!-- ═══════════════════════════════════════════════════════════════════════
     Post template — copied by new-post.js, not served itself.

     Its relative paths (../../) are written for where a post actually lives,
     blog/<slug>/index.html, so opening this file directly will look unstyled.
     That is expected; it is a stencil, not a page.

     {{PLACEHOLDERS}} are filled in by the script. Write the post inside
     <article class="post-article">, in plain HTML: h2, p, ul, blockquote,
     pre/code and img are all styled in ../blog.css.
     ═══════════════════════════════════════════════════════════════════════ -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#161826" />
        <meta name="description" content="{{DESCRIPTION}}" />
        <meta name="author" content="Ryan Lewandowski" />
        <title>{{TITLE}} · Ryan Lewandowski</title>
        <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
        <link rel="canonical" href="https://ryanlewan.com/blog/{{SLUG}}/" />

        <meta property="og:type" content="article" />
        <meta property="og:url" content="https://ryanlewan.com/blog/{{SLUG}}/" />
        <meta property="og:title" content="{{TITLE}}" />
        <meta property="og:description" content="{{DESCRIPTION}}" />
        <meta property="og:image" content="https://ryanlewan.com/assets/myPhoto.jpeg" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="{{TITLE}}" />
        <meta name="twitter:description" content="{{DESCRIPTION}}" />
        <meta name="twitter:image" content="https://ryanlewan.com/assets/myPhoto.jpeg" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../../style.css" />
        <link rel="stylesheet" href="../blog.css" />
    </head>

    <body class="blog-page">

        <header class="site-header">
            <div class="header-left">
                <a class="logo" href="../../" aria-label="Home">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M12 3a9 9 0 1 0 9 9h-6a3 3 0 1 1-3-3V3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </a>
            </div>

            <div class="header-right">
                <nav class="nav">
                    <a href="../">Blog</a>
                    <a class="nav-deep" href="../../">Home</a>
                    <a class="nav-deep" href="../../#projects">Projects</a>
                </nav>

                <a class="medium-btn" href="https://medium.com/@ryanlewan-sim"
                   target="_blank" rel="noopener noreferrer">
                    Read on Medium
                    <span class="medium-btn-arrow" aria-hidden="true">↗</span>
                </a>
            </div>
        </header>

        <main class="scroll-container">
            <div class="statusbar-cover" aria-hidden="true"></div>

            <section class="snap-section">
                <div class="section-inner blog-inner">
                    <div class="meta">
                        <span>{{DATE}}</span>
                        <span>{{READ}}</span>
                    </div>

                    <h1 class="post-heading">{{TITLE}}</h1>

                    <!-- ══ The post starts here ══════════════════════════ -->
                    <article class="post-article">

                        <p>Opening paragraph.</p>

                        <h2>A section</h2>

                        <p>
                            Body copy. Links look like
                            <a href="https://example.com">this</a>, and
                            <code>inline code</code> like that.
                        </p>

                        <pre><code>// a code block
console.log('hello');</code></pre>

                        <blockquote>A pulled-out line, if one earns it.</blockquote>

                    </article>
                    <!-- ══ and ends here ═════════════════════════════════ -->

                    <a class="post-back" href="../">
                        <span aria-hidden="true">←</span>
                        All posts
                    </a>

                    <footer class="site-footer">
                        <div class="footer-copy">© <span id="year"></span> Ryan Lewandowski</div>
                        <div class="links" aria-label="Social links">
                            <a href="https://github.com/ryanlew02" target="_blank" rel="noopener noreferrer">GitHub</a>
                            <span>/</span>
                            <button class="copy-email" data-email="ryanlewan.2@gmail.com">Email</button>
                            <span>/</span>
                            <a href="https://www.linkedin.com/in/ryan-lewandowski-120546164/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                            <span>/</span>
                            <a href="https://leetcode.com/u/ryanlew02/" target="_blank" rel="noopener noreferrer">LeetCode</a>
                        </div>
                    </footer>
                </div>
            </section>
        </main>

        <!-- Same script the index uses — year stamp, copy-email, scroll reveal.
             It renders no list here because there is no #postList on the page. -->
        <script src="../blog.js"></script>
    </body>
</html>
